# correcciones_minerales.ini
# Nombres cortos para minerales que son demasiado largos para la UI de minería.
# Formato: clave_original=nombre_corto
# Se aplica igual que correcciones.ini (después de traducción automática).
#
# Referencia: MrKraken acorta Hephaestanite → Heph (Raw)
# Criterio: nombres > 12 caracteres que aparecen en la UI de minería (scanner, laser, refinery)
# Formato del sufijo: (Raw) para minerales en bruto, (Ore) para menas
#
# ── Solo el mineral en bruto o como mena (los que aparecen en la UI del escáner) ──

# Hephaestanite — el más largo (13/17 chars), única abreviatura de MrKraken
items_commodities_hephaestanite=Hephae
items_commodities_hephaestanite_raw,P=Hephae (Raw)

# Quantainium — 17 chars con "(Raw)"
items_commodities_quantainium_raw=Quantanium (Raw)

# Los demás son 13-14 chars con "(Raw)"/"(Ore)" — borderline, dejamos como están
