name: Create Release

on:
  workflow_dispatch:
    inputs:
      sc_ver:
        description: 'Versión de SC (ej: 4.8.0). Si vacío, se detecta desde RSI Live.'
        required: false
        default: ''

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version and date
        id: meta
        run: |
          DATE=$(TZ='Europe/Madrid' date +'%d/%m/%Y %H:%M')
          TAG=$(TZ='Europe/Madrid' date +'%Y%m%d%H%M%S')
          INPUT_VER="${{ github.event.inputs.sc_ver }}"
          if [ -n "$INPUT_VER" ]; then
            SC_VER="$INPUT_VER"
          else
            SC_VER=$(grep -oP 'Frontend_PU_Version,P=\K[\d.]+' work/correcciones.ini | head -1)
            if [ -z "$SC_VER" ]; then
              SC_VER=$(curl -s "https://robertsspaceindustries.com/api/roadmap/v1/boards/1" \
                -H "User-Agent: Mozilla/5.0" \
                | grep -oP 'Live Version:\s*\K[\d.]+' | head -1)
            fi
            if [ -z "$SC_VER" ]; then SC_VER="live"; fi
          fi
          BUILD="${{ github.run_number }}"
          echo "tag=v${TAG}" >> $GITHUB_OUTPUT
          echo "name=Traduccion SC ${SC_VER} - build ${BUILD} - ${DATE}" >> $GITHUB_OUTPUT
          echo "sc_ver=${SC_VER}" >> $GITHUB_OUTPUT
          echo "build=${BUILD}" >> $GITHUB_OUTPUT

      - name: Create ZIP
        run: |
          mkdir -p zip_build/Data/Localization/spanish_\(spain\)
          cp Data/Localization/spanish_\(spain\)/global.ini zip_build/Data/Localization/spanish_\(spain\)/global.ini
          cd zip_build && zip -r "../traduccion_sc_${{ steps.meta.outputs.sc_ver }}_b${{ steps.meta.outputs.build }}.zip" Data

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          files: traduccion_sc_${{ steps.meta.outputs.sc_ver }}_b${{ steps.meta.outputs.build }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
